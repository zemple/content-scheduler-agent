name: Offline checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/reproduce.py --mode mock --output runs/ci-mock
      - run: python scripts/evaluate_expanded.py --mode mock --suite development --output runs/ci-expanded-dev
      - run: python scripts/evaluate_expanded.py --mode mock --suite validation --output runs/ci-expanded-validation
      - run: python scripts/audit_evidence.py
