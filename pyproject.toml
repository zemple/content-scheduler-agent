[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-scheduler-agent"
version = "0.1.0"
description = "Model-driven material review and draft scheduling CLI"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
content-scheduler = "scheduling_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
